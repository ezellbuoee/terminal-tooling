# Starship – Catppuccin Mocha powerline, single line
# left : os · path · git · ❯      right: status, duration, k8s/docker, runtime version, time
# NOTE: icons are Nerd Font private-use glyphs; edit with nvim, not via copy/paste from chat.
"$schema" = 'https://starship.rs/config-schema.json'
palette = "mocha"
add_newline = true

format = """
$os\
$directory\
$git_branch\
$git_status\
${custom.nogit_end}\
$character"""

right_format = """
$status\
$cmd_duration\
$kubernetes\
$docker_context\
$java\
$nodejs\
$python\
$time"""

[palettes.mocha]
mauve    = "#cba6f7"
blue     = "#89b4fa"
teal     = "#94e2d5"
green    = "#a6e3a1"
peach    = "#fab387"
yellow   = "#f9e2af"
red      = "#f38ba8"
sky      = "#89dceb"
text     = "#cdd6f4"
surface  = "#313244"
crust    = "#11111b"

[os]
disabled = false
style = "bg:mauve fg:crust bold"
format = "[ $symbol ]($style)"

[os.symbols]
Macos = ""
Linux = ""
Ubuntu = ""
Debian = ""
Windows = ""

[directory]
style = "bg:blue fg:crust"
repo_root_style = "bg:blue fg:crust bold"
before_repo_root_style = "bg:blue fg:crust"
read_only_style = "bg:blue fg:crust"
format = "[](fg:mauve bg:blue)[ $path ]($style)[$read_only]($read_only_style)"
read_only = "󰌾 "
home_symbol = "~"
truncation_length = 5
truncate_to_repo = false
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:teal fg:crust"
format = "[](fg:blue bg:teal)[ $symbol $branch ]($style)"

[git_status]
style = "bg:teal fg:crust bold"
format = "[($all_status$ahead_behind )]($style)[](fg:teal)"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕${ahead_count}⇣${behind_count} "
modified = "${count} "
staged = "${count} "
untracked = "${count} "
stashed = "${count} "
conflicted = "${count} "
deleted = "${count} "

[custom.nogit_end]
when = '! git rev-parse --is-inside-work-tree >/dev/null 2>&1'
format = "[](fg:blue)"
shell = ["sh"]

[character]
format = " $symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

# ── right side: self-contained pills
[status]
disabled = false
success_symbol = ""
symbol = ""
format = "[](fg:red)[ $symbol $status ]($style)[](fg:red) "
style = "bg:red fg:crust bold"

[cmd_duration]
min_time = 3000
style = "bg:peach fg:crust"
format = "[](fg:peach)[ 󱔑 $duration ]($style)[](fg:peach) "

[kubernetes]
disabled = false
symbol = "󱃾"
style = "bg:mauve fg:crust"
format = "[](fg:mauve)[ $symbol $context( /$namespace) ]($style)[](fg:mauve) "
detect_files = ["Chart.yaml", "kustomization.yaml", "skaffold.yaml"]
detect_folders = ["k8s", "helm", "kube"]

[docker_context]
symbol = ""
style = "bg:sky fg:crust"
format = "[](fg:sky)[ $symbol $context ]($style)[](fg:sky) "

[java]
symbol = ""
style = "bg:red fg:crust"
format = "[](fg:red)[ $symbol $version ]($style)[](fg:red) "
detect_files = ["pom.xml", "build.gradle", "build.gradle.kts", ".java-version", ".sdkmanrc"]
detect_extensions = []

[nodejs]
symbol = ""
style = "bg:green fg:crust"
format = "[](fg:green)[ $symbol $version ]($style)[](fg:green) "
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = []

[python]
symbol = ""
style = "bg:yellow fg:crust"
format = "[](fg:yellow)[ $symbol $version( $virtualenv) ]($style)[](fg:yellow) "

[time]
disabled = false
time_format = "%H:%M"
style = "bg:surface fg:text"
format = "[](fg:surface)[  $time ]($style)[](fg:surface)"
