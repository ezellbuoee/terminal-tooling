gui:
  theme:
    activeBorderColor: ["#cba6f7", bold]
    inactiveBorderColor: ["#6c7086"]
    selectedLineBgColor: ["#313244"]
  showIcons: true
  nerdFontsVersion: "3"
  sidePanelWidth: 0.3

git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never --line-numbers --side-by-side --syntax-theme="Catppuccin Mocha"

customCommands:
  # Structural (AST-aware) diff of the selected file via difftastic
  - key: "D"
    context: "files"
    description: "difftastic diff of selected file"
    command: "GIT_EXTERNAL_DIFF='difft --color=always --display=inline' git diff --ext-diff HEAD -- {{.SelectedFile.Name | quote}} | less -R"
    subprocess: true
  # Structural diff of the selected commit via difftastic
  - key: "D"
    context: "commits"
    description: "difftastic diff of selected commit"
    command: "GIT_EXTERNAL_DIFF='difft --color=always --display=inline' git show --ext-diff {{.SelectedLocalCommit.Hash}} | less -R"
    subprocess: true
